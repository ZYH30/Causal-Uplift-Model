[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-uplift-model"
version = "1.0.0"
description = "TLCD-RITE for role-informed personalized treatment-effect learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "matplotlib>=3.9",
  "networkx>=3.3",
  "optuna>=4.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "joblib>=1.4",
  "causal-learn>=0.1.4",
  "google-cloud-bigquery[pandas]>=3.42",
]

[tool.setuptools]
py-modules = ["data_generation", "graph_roles", "propensity", "rite_framework"]

[tool.setuptools.packages.find]
include = ["tlcd*", "models*", "experiments*", "empirical_experiments*"]

[tool.ruff]
line-length = 100
target-version = "py310"
