[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-uplift-model"
version = "0.1.0"
description = "Task-local neuro-symbolic discovery and role-separated observational uplift estimation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "optuna>=4.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "joblib>=1.4",
]

[tool.setuptools]
py-modules = ["data_generation", "graph_roles", "propensity", "ocu_framework"]

[tool.setuptools.packages.find]
include = ["ccia*", "models*", "experiments*", "empirical_experiments*"]

[tool.ruff]
line-length = 100
target-version = "py310"
